name: Build and Upload Extension Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to build/upload to (e.g., v2.3.0). Leave empty for Dry-Run build validation (no upload).'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Extract version name
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            # Dry-run fallback: Read version from package.json
            TAG_NAME=$(node -p "require('./package.json').version")
          fi
          
          # Clean version string (remove leading 'v' if present)
          VERSION="${TAG_NAME#v}"
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version extracted: $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build extension packages
        run: npm run build -- ${{ env.RELEASE_VERSION }}

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        # Only run if triggered by a release publish, or manual run with target tag_name
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: dist/flux-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch release event to website repo
        # Only run if a release upload actually took place
        if: success() && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != ''))
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_PAT }}
          repository: Satya-Siba-Nayak/Flux-Extension-Website
          event-type: extension-released
          client-payload: '{"version": "${{ env.RELEASE_VERSION }}", "tag": "${{ github.event.release.tag_name || github.event.inputs.tag_name }}", "url": "${{ github.event.release.html_url || format(''https://github.com/{0}/releases/tag/{1}'', github.repository, github.event.release.tag_name || github.event.inputs.tag_name) }}"}'
        continue-on-error: true
